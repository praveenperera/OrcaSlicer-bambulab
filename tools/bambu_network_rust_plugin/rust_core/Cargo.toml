[package]
name = "bambu_network_rust_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
md-5 = "0.11.0"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
suppaftp = { version = "8.0.3", default-features = false, features = ["rustls-ring", "deprecated"] }
ureq = "3.3.0"
